name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov authenticates with GitHub OIDC, no token needed
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run mutation
        env:
          # Upload the report (README badge) only for pushes to master
          STRYKER_DASHBOARD_API_KEY: ${{ github.event_name == 'push' && secrets.STRYKER_DASHBOARD_API_KEY || '' }}
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/lcov.info
