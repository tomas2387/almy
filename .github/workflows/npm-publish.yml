# Runs the tests and publishes the package to npm when a release is created.
# Publishing uses npm Trusted Publishing (OIDC), configured on npmjs.com for this workflow,
# and stages the version so it is only released after a maintainer approves it with 2FA.

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing: npm authenticates with GitHub OIDC, no token needed
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      # Only dist/ needs to be published: drop dev-only fields to keep the package small
      - run: npm pkg delete scripts devDependencies allowScripts
      # Staged publishing: the version stays pending until a maintainer approves it
      # with 2FA on npmjs.com (or `npm stage approve <id>`)
      - run: npm stage publish
